server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths (/login, /projects/1) fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build files can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
